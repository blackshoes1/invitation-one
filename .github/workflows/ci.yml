name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN 최소 권한 — 검증만 하므로 읽기면 충분 (branch protection required check 로 사용 가능)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 나스(시놀로지 DS920+)로 옮길 준비는 돼 있다 — docs/NAS_RUNNER.md · ops/nas/.
  # 옮기려면 아래 한 줄을 `runs-on: [self-hosted, linux, x64]` 로 바꾸면 된다.
  #
  # ⚠️ 러너를 실제로 등록하기 **전에** 바꾸지 말 것. self-hosted 잡은 받아 줄 러너가
  #    없으면 실패가 아니라 queued 로 매달려 있다가 24시간 뒤 취소된다. 그러면
  #    Actions 한도가 리셋돼도 이 잡은 영영 돌지 않는다.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 빌드/테스트용 더미 값 — 실제 Supabase·SMS·카카오 운영 자원에는 접근하지 않는다.
      # (NEXT_PUBLIC_* 가 비어 있으면 앱은 '미설정' 분기로 동작하고, 서버 키는 전혀 주지 않는다)
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_INVITATION_KEY: ci-dummy-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # P1-5 E2E — 방금 빌드한 앱을 next start 로 띄워 검증 (DB 필요 시나리오는 skip)
      # 나스 러너로 옮길 때는 `--with-deps` 를 빼야 한다 — apt-get 을 부르는데 러너에
      # sudo 가 없고, 러너 이미지가 Playwright 공식 이미지 기반이라 시스템 의존성이
      # 이미 들어 있다 (docs/NAS_RUNNER.md).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # ⚠️ 아래 두 잡은 아직 GitHub 러너에 남아 있다 (나스 이전 2단계 — docs/NAS_RUNNER.md).
  #    Actions 한도가 소진된 동안에는 **시작조차 못 하고 즉시 실패**한다.
  #    끄지 않고 남겨 둔다 — 검증을 지워서 초록을 만드는 건 고장을 감추는 것이다.
  #    그동안은 로컬에서 돌린다: `bash scripts/db-verify.sh` · `bash scripts/e2e-db-ci.sh`

  # P1-5 — DB 필요 E2E (초대·배송신청·관리자 세션·체크인 운영시간)
  # 레거시를 타임스탬프 사본으로 복사해 supabase start 가 전체 스키마를 적용,
  # 시드 후 로컬 스택을 향해 앱을 빌드·실행한다 (운영 자원 접근 없음).
  e2e-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_INVITATION_KEY: ci-dummy-key
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: bash scripts/e2e-db-ci.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # P1-6 — 빈 DB 에 레거시→마이그레이션 전체 적용 + 권한/시그니처 단언
  # (supabase CLI 는 시작 시 supabase/migrations 를 자동 적용해 레거시 선행이
  #  불가능하므로, 일반 postgres 컨테이너 + 스크립트가 롤/스키마를 직접 준비)
  db-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - "54322:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-verify.sh

  nas-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh -n ops/photo-archive/archive.sh ops/photo-archive/healthcheck.sh scripts/test-photo-archive.sh
      - run: sh scripts/test-photo-archive.sh
