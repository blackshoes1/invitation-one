# P1-4 알림 아웃박스 안전망 (docs/NOTIFICATIONS.md)
#
# ⚠️ 2026-09-08: **이 크론이 Actions 무료 한도를 소진시켰다.** 그 순간 CI 잡이
# 시작조차 못 하는 상태가 됐다 (러너 미배정 · 3초 만에 실패 · 로그 없음).
# 30분 → 3시간으로 낮춰도 월 ~240분이라 계속 압박했다. 분 단위 반올림이라
# 1초를 돌아도 1분으로 계산된다.
#
# 그래서 **하루 2회**로 더 낮췄다 (월 ~60분). 이렇게 낮춰도 되는 이유는 이게
# 실제 드레인을 담당하지 않기 때문이다 — 주 경로는 신청 API 의 after(),
# 하객 브라우저, 그리고 **Supabase pg_cron 5분**이다. 이 워크플로의 역할은
# "그 셋이 다 죽었을 때 시끄럽게 알리는 것"뿐이라 12시간 안에 알면 충분하다.
#
# 더 낫게 하려면 나스로 옮기면 된다 (docs/NAS_RUNNER.md) — self-hosted 는
# Actions 분을 전혀 쓰지 않아 1시간 간격으로 돌려도 공짜다. 옮길 준비는 돼 있고
# (ops/nas/), 옮긴 뒤엔 아래 schedule 을 지우면 된다.
#
# 판정 로직은 `scripts/notify-drain.sh` 한 곳에만 있다 — 나스와 여기가 갈라지면
# 한쪽이 고장을 놓친다. 워크플로에 인라인으로 복사해 두지 말 것.
#
# 왜 POST 인가 (공유 비밀 없음):
#   GET /api/notify 는 CRON_SECRET Bearer 를 요구한다. 저장소 secret 과 Vercel
#   환경변수 두 곳의 값이 같아야 하는데, 한쪽만 바뀌면 401 이 되고 안전망이 조용히
#   죽는다 — 실제로 그렇게 오래 멈춰 있었다. POST 는 파라미터를 받지 않는
#   "보낼 게 있으면 보내라" 신호일 뿐이고(참여자 지정 불가·PII 없음·rate limit 있음),
#   하객 브라우저가 신청 직후 호출하는 것과 똑같은 공개 경로다.
#   GET + CRON_SECRET 경로는 vercel.json 의 Vercel Cron 용으로 그대로 둔다.
name: notify-drain

on:
  schedule:
    - cron: "0 0,12 * * *"   # 하루 2회 (월 ~60분). 나스로 옮기면 지운다.
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Drain notification outbox
        run: bash scripts/notify-drain.sh
