# P1-4 알림 아웃박스 안전망 (docs/NOTIFICATIONS.md)
#
# ⚠️ 정기 실행은 **나스로 옮겼다** (2026-09-08). 이 워크플로에는 스케줄이 없다.
#
# 이유: 이 크론이 비공개 저장소 Actions 무료 한도를 갉아먹다가 결국 한도를
# 소진시켰고, 그 순간 CI 잡이 **시작조차 못 하는** 상태가 됐다 (러너 미배정 ·
# 3초 만에 실패 · 로그 없음). 실제로 2026-09-08 에 그렇게 막혔다.
# 30분 → 3시간으로 낮춰도 월 ~240분이라 한도를 계속 압박했다.
#
# 정기 실행은 시놀로지 DSM 작업 스케줄러가 `scripts/notify-drain.sh` 를 직접
# 돌린다 (docs/NAS_RUNNER.md). Actions 분을 전혀 쓰지 않는다.
# 여기 남은 workflow_dispatch 는 나스가 꺼져 있을 때의 수동 대체 경로다.
#
# 판정 로직은 스크립트 한 곳에만 있다 — 나스와 여기가 갈라지면 한쪽이 고장을
# 놓친다. 워크플로에 인라인으로 복사해 두지 말 것.
#
# 왜 POST 인가 (공유 비밀 없음):
#   GET /api/notify 는 CRON_SECRET Bearer 를 요구한다. 저장소 secret 과 Vercel
#   환경변수 두 곳의 값이 같아야 하는데, 한쪽만 바뀌면 401 이 되고 안전망이 조용히
#   죽는다 — 실제로 그렇게 오래 멈춰 있었다. POST 는 파라미터를 받지 않는
#   "보낼 게 있으면 보내라" 신호일 뿐이고(참여자 지정 불가·PII 없음·rate limit 있음),
#   하객 브라우저가 신청 직후 호출하는 것과 똑같은 공개 경로다.
#   GET + CRON_SECRET 경로는 vercel.json 의 Vercel Cron 용으로 그대로 둔다.
name: notify-drain

on:
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Drain notification outbox
        run: bash scripts/notify-drain.sh
