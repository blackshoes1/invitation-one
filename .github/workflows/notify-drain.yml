# P1-4 알림 아웃박스 안전망 cron (docs/NOTIFICATIONS.md)
# 무트래픽 상황에서도 실패·중단된 알림이 재시도되도록 /api/notify 를 호출한다.
# (주 경로는 신청 API 의 요청 기반 드레인 — 이건 안전망일 뿐이라 지연·중복 무해)
#
# - 3시간 간격: 비공개 레포 Actions 무료 한도(월 2,000분)를 크론이 대부분 소진해
#   CI 가 시작조차 못 하던 문제로 30분 → 3시간으로 조정 (월 ~240분).
#   급할 때는 workflow_dispatch 로 수동 실행.
# - 예식(2026-10) 이후에는 이 워크플로를 비활성화해도 된다
#
# 왜 POST 인가 (공유 비밀 없음):
#   GET /api/notify 는 CRON_SECRET Bearer 를 요구한다. 저장소 secret 과 Vercel
#   환경변수 두 곳의 값이 같아야 하는데, 한쪽만 바뀌면 401 이 되고 안전망이 조용히
#   죽는다 — 실제로 그렇게 오래 멈춰 있었다. POST 는 파라미터를 받지 않는
#   "보낼 게 있으면 보내라" 신호일 뿐이고(참여자 지정 불가·PII 없음·rate limit 있음),
#   하객 브라우저가 신청 직후 호출하는 것과 똑같은 공개 경로다. 크론이 이걸 쓰면
#   맞춰야 할 비밀이 사라진다.
#   GET + CRON_SECRET 경로는 vercel.json 의 Vercel Cron 용으로 그대로 둔다.
name: notify-drain

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain notification outbox
        run: |
          # POST 는 한 번에 5건까지만 꺼낸다 — 밀린 게 있으면 빌 때까지 반복한다.
          # (rate limit 은 IP 당 10분 30회라 최대 5회는 여유롭다)
          total_sent=0
          for i in $(seq 1 5); do
            code=$(curl -sS -m 30 -X POST -o /tmp/out.json -w '%{http_code}' \
              https://kkachi.vercel.app/api/notify) || {
              echo "::error::드레인 요청 실패 (curl)"; exit 1; }
            cat /tmp/out.json; echo
            # 안전망이 안 도는 것은 그 자체로 장애다 — 조용히 초록으로 넘기지 않는다.
            # (이전 버전은 401 에 exit 0 이라 몇 주간 멈춘 걸 아무도 몰랐다)
            [ "$code" = "200" ] || { echo "::error::드레인 실패 — HTTP $code"; exit 1; }

            claimed=$(jq -r '.claimed // 0' /tmp/out.json)
            sent=$(jq -r '.sent // 0' /tmp/out.json)
            failed=$(jq -r '.failed // 0' /tmp/out.json)
            total_sent=$((total_sent + sent))

            # 카카오가 꺼져 있으면 알림은 한 건도 못 나간다 — 이것도 장애다.
            # (클레임 자체를 안 하므로 반복해도 의미 없다)
            [ "$(jq -r '.kakao' /tmp/out.json)" = "false" ] && {
              echo "::error::카카오 미설정 — 알림이 발송되지 않는다"; exit 1; }

            # 보낼 게 없을 때 서버가 확인해 준 토큰 상태. refresh token 은 약 2개월
            # 만료라, 주문이 없는 조용한 기간에 만료되면 정작 필요한 날 먹통이 된다.
            # 여기서 걸러 예식 전에 재발급할 시간을 번다.
            token=$(jq -r '.tokenStatus // empty' /tmp/out.json)
            if [ "$token" = "expired" ]; then
              echo "::error::카카오 토큰 만료 — 재발급 필요 (src/lib/kakao.ts 헤더 참고)"
              exit 1
            fi

            # 꺼냈는데 한 건도 못 보냈다 = 토큰 만료 등 발송 자체가 깨진 상태.
            # 백오프가 걸려 지금 다시 꺼내도 소용없으니 멈추고, 조용히 넘기지 않는다.
            # (refresh token 은 약 2개월 만료 — 예식 전에 알아채야 한다)
            if [ "$claimed" != "0" ] && [ "$sent" = "0" ] && [ "$failed" != "0" ]; then
              echo "::error::클레임 ${claimed}건 중 발송 0건 — 카카오 발송이 깨졌다"
              exit 1
            fi

            # 더 꺼낼 게 없으면 종료
            [ "$claimed" = "0" ] && break
          done
          echo "총 발송: $total_sent"
