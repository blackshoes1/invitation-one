# Included inside DSM's existing HTTP/HTTPS server blocks.
# Only the wedding photo namespace is proxied; the photo service checks signed permissions.
location ^~ /photos/snap/ {
    if ($scheme != https) { return 404; }
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 20m;
    client_body_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 320s;
}

location = /invitation-photos-health {
    if ($scheme != https) { return 404; }
    proxy_pass http://127.0.0.1:18080/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}
