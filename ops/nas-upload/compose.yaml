services:
  nas-photos:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    user: "${NAS_UID:?Set NAS_UID}:${NAS_GID:?Set NAS_GID}"
    restart: unless-stopped
    init: true
    environment:
      NAS_PHOTO_SECRET: ${NAS_PHOTO_SECRET:?Set a random secret of at least 32 characters}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://kkachi.vercel.app}
      PHOTO_ROOT: /photos
    ports:
      # DSM reverse proxy connects locally; do not expose this HTTP port to the internet.
      - "127.0.0.1:18080:8080"
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./protocol.mjs:/app/protocol.mjs:ro
      - ${NAS_PHOTO_FOLDER:-/volume1/photo/wedding-direct}:/photos
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
